name: Agent dispatch

on:
  issues:
    types:
      - labeled

concurrency:
  group: agent-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    name: Dispatch Cursor Cloud Agent
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out dispatch scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dispatch one Cursor Cloud Agent
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python .github/scripts/agent_dispatch.py dispatch --event-file "${GITHUB_EVENT_PATH}"
