name: Agent spec dispatch

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Positive GitHub Issue number for an Agent Task awaiting specification
        required: true
        type: number

concurrency:
  group: agent-spec-dispatch-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  authorize:
    name: Authorize default-branch workflow
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        shell: bash
        env:
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "Spec Agent dispatch only runs from the default branch."
            exit 1
          fi

  dispatch:
    name: Dispatch Spec Agent
    needs: authorize
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: spec-agent-dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out dispatch scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dispatch one Spec Agent
        shell: bash
        env:
          CAPT_SPEC_DISPATCH_REF: ${{ github.ref }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python .github/scripts/agent_spec_dispatch.py dispatch --issue "${{ github.event.inputs.issue_number }}"
