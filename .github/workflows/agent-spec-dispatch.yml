name: Agent spec dispatch

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Positive GitHub Issue number for an Agent Task awaiting specification
        required: true
        type: number

concurrency:
  group: agent-spec-dispatch-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    name: Dispatch Spec Agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out dispatch scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dispatch one Spec Agent
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python .github/scripts/agent_spec_dispatch.py dispatch --issue "${{ github.event.inputs.issue_number }}"
